openapi: 3.1.0
info:
  title: AutoHire API
  version: 0.1.0
  description: Foundation API contract only. Business logic is intentionally not implemented.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /profile:
    get:
      tags: [profile]
      operationId: getProfile
      responses:
        "200":
          description: Single-user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      responses:
        "200":
          description: Discovered job postings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobPosting"
  /applications:
    get:
      tags: [applications]
      operationId: listApplications
      responses:
        "200":
          description: Applications and review queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
  /applications/{applicationId}/human-review:
    post:
      tags: [applications]
      operationId: requestHumanReview
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Application marked as needing human review.
components:
  schemas:
    ApplicationStatus:
      type: string
      enum: [DISCOVERED, SCORED, QUEUED, NEEDS_HUMAN, SUBMITTED, SKIPPED, FAILED]
    JobSource:
      type: string
      enum: [WELLFOUND, NAUKRI, INSTAHYRE, COMPANY_SITE, LINKEDIN, MANUAL]
    DecisionReason:
      type: string
      enum:
        - SCORE_AUTO_QUEUE
        - LOW_CONFIDENCE
        - DREAM_COMPANY
        - DAILY_CAP_REACHED
        - USER_REQUESTED
        - LINKEDIN_SEMI_AUTOMATIC
    UserProfile:
      type: object
      required: [id, fullName, email, education, skills, links, preferences]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        education:
          type: object
        skills:
          type: array
          items:
            type: string
        links:
          type: object
          additionalProperties:
            type: string
        preferences:
          type: object
    JobPosting:
      type: object
      required: [id, source, title, url, requiredSkills]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/JobSource"
        title:
          type: string
        companyName:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        requiredSkills:
          type: array
          items:
            type: string
    Application:
      type: object
      required: [id, jobPostingId, status]
      properties:
        id:
          type: string
          format: uuid
        jobPostingId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        decisionReason:
          anyOf:
            - $ref: "#/components/schemas/DecisionReason"
            - type: "null"
