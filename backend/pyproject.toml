[project]
name = "autohire-backend"
version = "0.1.0"
description = "Foundation scaffold for AutoHire"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.3",
    "apscheduler>=3.10.4",
    "asyncpg>=0.30.0",
    "browser-use==0.12.2",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "redis>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.31.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
