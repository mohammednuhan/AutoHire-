[project]
name = "autohire-backend"
version = "0.1.0"
description = "AutoHire backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "redis[asyncio]==5.0.8",
    "browser-use==0.12.2",
    "playwright==1.47.0",
    "pymupdf==1.24.11",
    "python-docx==1.1.2",
    "weasyprint==62.3",
    "pillow==10.4.0",
    "apscheduler==3.10.4",
    "python-telegram-bot==21.5",
    "google-generativeai==0.8.3",
    "anthropic==0.34.2",
    "httpx==0.27.2",
    "beautifulsoup4==4.12.3",
    "python-multipart==0.0.12",
    "bcrypt==4.2.0",
    "pyjwt==2.9.0",
]

[dependency-groups]
dev = [
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
